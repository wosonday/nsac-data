# Tham số từng task — giá trị chép từ NASA-cl/src/nasa_cl/pipeline/config.py (run 2026-11-11).
# Mô hình khai báo ở khóa `models` của từng task (dựng bằng sky_ml._models.build_model).
hr:
  description: "MMASH (22 người, mặt đất): HR trung bình 5 phút tới từ 30 phút trước"
  inputs:
    - processed/sample-v2/mmash_minutes.csv.gz
  kind: regression
  target: hr_next_5min
  unit: bpm
  window: {past: 30, future: 5, step: 5}     # đơn vị: phút
  # Bước 2 – build-features: chọn đặc trưng (tên trong FEATURES của 2_build_features/windows.py).
  # Thứ tự & danh sách dưới đây = cấu hình tái lập run 11/11. Thêm: median_all, range_all, slope_all.
  features: [last_value, mean_last_5, mean_all, std_all, change_last_10, min_all, max_all]
  valid_hr_range: [30.0, 220.0]              # ngưỡng kỹ thuật loại số đo hỏng, KHÔNG phải ngưỡng lâm sàng
  split: {type: leave_one_subject_out}
  baseline: last_value
  deploy_model: ridge          # mô hình dùng ở bước 5 (predict); chọn TRƯỚC, không chọn theo điểm test
  seed: 17
  interval_alpha: 0.10        # khoảng dự đoán 90%
  bootstrap_samples: 10000    # CI95 lấy mẫu lại theo người
  permutation_tests: 0        # 0 = bỏ qua (task này nhiều cửa sổ, tốn thời gian)
  save_models:                # lưu mô hình đã huấn luyện vào runs/<task>/<run>/3_models/
    final: true               # fit trên toàn bộ dữ liệu → dùng cho người MỚI (vd. persona nsac)
    folds: false              # true = lưu cả mô hình từng fold LOSO (22 × 3 file) để kiểm toán OOF
  # Mô hình: class = đường dẫn import; params = tham số; scale = chuẩn hóa trong pipeline (fit trên train của từng fold)
  models:
    last_value:
      class: sky_ml._models.LastValue
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 1.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, num_leaves: 15,
               min_child_samples: 50, reg_lambda: 5.0, verbose: -1, n_jobs: 2}

# ---------------------------------------------------------------------------------------------
# Ba task còn lại của NASA-cl (round 1 = tái lập run 2026-11-11). deploy_model ghi rõ căn cứ chọn.
dose:
  description: "RadLab Lidal (ISS, Columbus, 2022): liều hấp thụ trung bình 1 giờ tới từ 6 giờ trước"
  inputs:
    - raw/radlab/instruments/Lidal/*.csv     # glob, khớp theo COPY_MANIFEST
  kind: regression
  target: dose_rate_next_1h
  unit: uGy/h
  window: {past: 72, future: 12, step: 12}   # đơn vị: bước 5 phút (6 giờ → 1 giờ)
  features: [last_value, mean_last_5, mean_all, std_all, change_last_10, min_all, max_all]
  split: {type: by_month, test_months: [4, 5, 6, 7, 8, 9, 10, 11, 12], gap_days: 1}
  baseline: last_value
  deploy_model: lightgbm      # theo run NASA-cl 11/11 (đã biết trước) — KHÔNG chọn lại theo run này
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000    # CI95 lấy mẫu lại theo THÁNG (9 đơn vị)
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    last_value:
      class: sky_ml._models.LastValue
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 1.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, num_leaves: 15,
               min_child_samples: 50, reg_lambda: 5.0, verbose: -1, n_jobs: 2}

cpet:
  description: "UTMB CFT70 (33 người, nằm giường 70 ngày): thay đổi REL VO2peak POST1 − PRE"
  inputs:
    - raw/nlsp/MR080G.zip                    # CPET PRE/POST1/POST2
    - raw/nlsp/MR079G.zip                    # đối chiếu GROUP
    - raw/nlsp/BRSMImmune.zip                # đối chiếu GROUP
    - raw/nlsp/download_manifest.csv         # SHA-256 + MD5 từng member ZIP
  kind: regression
  target: delta_vo2
  unit: source_REL_VO2PK      # đơn vị nguồn; suy luận là mL/kg/min, chờ codebook
  features: [pre_vo2, age, group_CONTROL, group_EXERCISE, group_FLY]
  split: {type: leave_one_subject_out}
  baseline: persistence
  deploy_model: mean_delta    # GROUP không tồn tại với phi hành gia thật → mô hình dùng cho demo không dựa vào GROUP
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 200      # task nhỏ (33 hàng) → chạy được
  save_models: {final: true, folds: false}
  models:
    persistence:              # dự đoán: VO2peak không đổi
      class: sklearn.dummy.DummyRegressor
      params: {strategy: constant, constant: 0.0}
    mean_delta:               # mức thay đổi trung bình của tập train
      class: sklearn.dummy.DummyRegressor
      params: {strategy: mean}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 150, learning_rate: 0.05, max_depth: 2, num_leaves: 4,
               min_child_samples: 5, reg_lambda: 5.0, verbose: -1, n_jobs: 1}

cpet_physio:                  # cùng dữ liệu cpet, CHỈ đặc trưng sinh lý (không GROUP) — contract dùng được cho phi hành gia
  builder: cpet
  description: "UTMB CFT70: thay đổi VO2peak chỉ từ VO2peak PRE + tuổi (không dùng nhóm can thiệp)"
  inputs: [raw/nlsp/MR080G.zip, raw/nlsp/MR079G.zip, raw/nlsp/BRSMImmune.zip, raw/nlsp/download_manifest.csv]
  kind: regression
  target: delta_vo2
  unit: source_REL_VO2PK
  features: [pre_vo2, age]
  split: {type: leave_one_subject_out}
  baseline: persistence
  deploy_model: mean_delta
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 200
  save_models: {final: true, folds: false}
  models:
    persistence:
      class: sklearn.dummy.DummyRegressor
      params: {strategy: constant, constant: 0.0}
    mean_delta:
      class: sklearn.dummy.DummyRegressor
      params: {strategy: mean}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 150, learning_rate: 0.05, max_depth: 2, num_leaves: 4,
               min_child_samples: 5, reg_lambda: 5.0, verbose: -1, n_jobs: 1}

sleep:
  description: "Sleep-EDF Expanded (10 đêm, mặt đất): chấm giai đoạn ngủ từng epoch 30 s từ EEG/EOG"
  inputs:
    - raw/sleep_edfx/1.0.0/sleep-cassette/SC4*-PSG.edf
    - raw/sleep_edfx/1.0.0/sleep-cassette/SC4*-Hypnogram.edf
  kind: classification
  target: stage
  classes: [W, N1, N2, N3, REM]
  wake_margin_epochs: 60      # giữ 30 phút thức trước/sau giấc ngủ
  features: all               # 54 cột: 3 kênh × 6 dải × (hiện tại, trước, sau)
  split: {type: leave_one_subject_out}
  baseline: majority
  deploy_model: lightgbm      # theo run NASA-cl 11/11 (đã biết trước)
  seed: 17
  bootstrap_samples: 10000
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    majority:                 # đoán lớp đa số; xác suất = tỷ lệ lớp
      class: sklearn.dummy.DummyClassifier
      params: {strategy: prior}
    logistic:
      class: sklearn.linear_model.LogisticRegression
      params: {max_iter: 3000, class_weight: balanced}
      scale: true
    lightgbm:
      class: lightgbm.LGBMClassifier
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, num_leaves: 15,
               min_child_samples: 40, reg_lambda: 5.0, class_weight: balanced, verbose: -1, n_jobs: 2}

# ---------------------------------------------------------------------------------------------
# Bổ sung 14/11 tối (sau khi đánh giá NSAC_Data_Supplement): chốt cấu hình TRƯỚC khi chạy.
dose_orbit:                   # như dose + vị trí ISS TẠI cutoff (đã có sẵn trong file Lidal)
  builder: dose
  description: "RadLab Lidal: liều 1 giờ tới từ 6 giờ trước + vị trí ISS lúc dự báo (vĩ độ, kinh độ, độ cao)"
  inputs:
    - raw/radlab/instruments/Lidal/*.csv
  kind: regression
  target: dose_rate_next_1h
  unit: uGy/h
  window: {past: 72, future: 12, step: 12}
  features: [last_value, mean_last_5, mean_all, std_all, change_last_10, min_all, max_all]
  context: [latitude, longitude, altitude]   # → latitude_now, longitude_now, altitude_now
  split: {type: by_month, test_months: [4, 5, 6, 7, 8, 9, 10, 11, 12], gap_days: 1}
  baseline: last_value
  deploy_model: lightgbm      # chốt trước; so sánh trung thực với task dose cùng cách chia
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    last_value:
      class: sky_ml._models.LastValue
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 1.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 300, learning_rate: 0.05, max_depth: 4, num_leaves: 15,
               min_child_samples: 50, reg_lambda: 5.0, verbose: -1, n_jobs: 2}

sleep_act:
  description: "UTMB Bed Rest Campaign 1 actigraphy: hiệu suất ngủ đêm tới từ 7 đêm trước (3 người, ~60 đêm nằm giường)"
  inputs:
    - raw/nlsp/BRSMAct.zip
    - raw/nlsp/download_manifest.csv
  kind: regression
  measure: efficiency         # efficiency (%) | duration (h) | latency (h)
  target: sleep_efficiency_next_night
  unit: "%"
  window: {past: 7, future: 1, step: 1}      # đơn vị: đêm
  features: [last_value, mean_last_5, mean_all, std_all, min_all, max_all]
  split: {type: leave_one_subject_out}
  baseline: last_value
  deploy_model: personal_mean # chốt trước: 3 người → mô hình đơn giản nhất có lý
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    last_value:               # đêm tới = đêm vừa rồi
      class: sky_ml._models.LastValue
    personal_mean:            # đêm tới = trung bình 7 đêm gần nhất của chính người đó
      class: sky_ml._models.LastValue
      params: {column: mean_all}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 100, learning_rate: 0.05, max_depth: 2, num_leaves: 4,
               min_child_samples: 10, reg_lambda: 5.0, verbose: -1, n_jobs: 1}

# ---------------------------------------------------------------------------------------------
# 14/11 tối: vitals (CRF), mood (POMS), glucose (OGTT) — chốt cấu hình TRƯỚC khi chạy.
vitals_sbp: &vitals
  builder: vitals
  description: "UTMB CRF: huyết áp tâm thu buổi sáng NGÀY TỚI từ 7 ngày trước; train Campaign 3, kiểm tra ngoài cohort trên 6 persona"
  inputs: [raw/nlsp/CRF.zip, raw/nlsp/download_manifest.csv]
  kind: regression
  measure: sbp                # sbp | dbp | temp | pulse
  target: sbp_next_day
  unit: mmHg
  train_cohort: campaign_3    # 23 người
  external_cohorts: [cft70, campaign_1]   # 5160, 8072, 8936 + C1G0001–3 (= 6 persona) — KHÔNG dùng để train
  window: {past: 7, future: 1, step: 1}   # đơn vị: ngày
  features: [last_value, mean_last_5, mean_all, std_all, min_all, max_all]
  split: {type: leave_one_subject_out}
  baseline: last_value
  deploy_model: ridge         # chốt trước: kết hợp tuyến tính lịch sử gần, 23 người đủ cho ridge
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    last_value:
      class: sky_ml._models.LastValue
    personal_mean:
      class: sky_ml._models.LastValue
      params: {column: mean_all}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 200, learning_rate: 0.05, max_depth: 3, num_leaves: 7,
               min_child_samples: 30, reg_lambda: 5.0, verbose: -1, n_jobs: 2}

vitals_dbp:
  <<: *vitals
  description: "UTMB CRF: huyết áp tâm trương ngày tới từ 7 ngày trước"
  measure: dbp
  target: dbp_next_day

vitals_temp:
  <<: *vitals
  description: "UTMB CRF: nhiệt độ cơ thể buổi sáng ngày tới từ 7 ngày trước"
  measure: temp
  target: temp_next_day
  unit: "°C"

mood:
  description: "UTMB CFT70 POMS: điểm rối loạn tâm trạng (TMD) lần đo tới (~1 tuần) từ 3 lần đo trước"
  inputs: [raw/nlsp/NNX10AP86G.zip, raw/nlsp/download_manifest.csv]
  kind: regression
  target: tmd_next
  unit: "điểm TMD"            # POMS Total Mood Disturbance; cao hơn = rối loạn tâm trạng nhiều hơn
  window: {past: 3, future: 1, step: 1}   # đơn vị: LẦN ĐO (không đều, ~7 ngày)
  features: [last_value, mean_all, std_all, min_all, max_all]
  split: {type: leave_one_subject_out}
  baseline: last_value
  deploy_model: personal_mean # chốt trước: thang tự đánh giá, ít điểm/người → trung bình cá nhân
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 0
  save_models: {final: true, folds: false}
  models:
    last_value:
      class: sky_ml._models.LastValue
    personal_mean:
      class: sky_ml._models.LastValue
      params: {column: mean_all}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true
    lightgbm:
      class: lightgbm.LGBMRegressor
      params: {n_estimators: 100, learning_rate: 0.05, max_depth: 2, num_leaves: 4,
               min_child_samples: 10, reg_lambda: 5.0, verbose: -1, n_jobs: 1}

glucose:
  description: "UTMB CFT70 OGTT: thay đổi đường huyết lúc đói từ trước nằm giường đến ngày nằm giường 66; một hàng / người"
  inputs: [raw/nlsp/NNX10AP86G.zip, raw/nlsp/download_manifest.csv]
  kind: regression
  target: delta_glucose_0
  unit: mg/dL
  target_study_day: 66
  features: [pre_glucose_0, pre_glucose_120, pre_insulin_0]
  split: {type: leave_one_subject_out}
  baseline: persistence
  deploy_model: mean_delta    # chốt trước (như cpet): 23 người, không kỳ vọng mô hình cá nhân hóa
  seed: 17
  interval_alpha: 0.10
  bootstrap_samples: 10000
  permutation_tests: 200
  save_models: {final: true, folds: false}
  models:
    persistence:
      class: sklearn.dummy.DummyRegressor
      params: {strategy: constant, constant: 0.0}
    mean_delta:
      class: sklearn.dummy.DummyRegressor
      params: {strategy: mean}
    ridge:
      class: sklearn.linear_model.Ridge
      params: {alpha: 10.0}
      scale: true

vitals_pulse:                 # nhịp tim buổi sáng của CHÍNH 6 persona (dữ liệu thật) — bổ sung cho hr (MMASH)
  <<: *vitals
  description: "UTMB CRF: nhịp tim buổi sáng ngày tới từ 7 ngày trước"
  measure: pulse
  target: pulse_next_day
  unit: bpm
