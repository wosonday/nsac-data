# Từ điển dữ liệu: mô tả cột và giới hạn → pipeline tự sinh README.md (data card) cho mỗi thư mục dữ liệu.
# Đơn vị "{unit}" được thay bằng `unit` của task trong configs/tasks.yaml.

kinds:
  features:
    title: "(1) Dữ liệu đã xử lý — đầu vào mô hình"
    purpose: >-
      Bảng mẫu sau khi chuẩn hóa và tạo đặc trưng (bước 2). Mỗi hàng là MỘT mẫu đưa vào mô hình:
      đặc trưng chỉ lấy từ quá khứ, target là giá trị cần dự báo. Đây là dữ liệu duy nhất bước train đọc.
  models:
    title: "(3) Mô hình đã huấn luyện"
    purpose: >-
      Mô hình đã fit (joblib) + dự đoán ngoài tập huấn luyện (OOF) + kết quả đánh giá.
      `final` fit trên TOÀN BỘ người của bảng đặc trưng → chỉ dùng dự báo cho NGƯỜI MỚI.
      Điểm đánh giá luôn lấy từ OOF (mỗi người được dự đoán bởi mô hình chưa từng thấy họ).
  predictions:
    title: "(2) Dữ liệu dự đoán"
    purpose: >-
      Kết quả dự báo của mô hình đã lưu (bước 5) cho một file đầu vào mới, kèm khoảng 90%,
      cờ từ chối dự báo (abstain) và cờ in_sample.

columns:
  subject_id: {unit: "", description: "Mã người/chuỗi, có namespace nguồn (vd. mmash:user_1). Đơn vị độc lập khi chia fold."}
  cutoff_time: {unit: "phút (tương đối)", description: "Điểm cuối của cửa sổ quá khứ. Không phải UTC."}
  last_value: {unit: "{unit}", description: "Giá trị đo cuối trong cửa sổ quá khứ."}
  mean_last_5: {unit: "{unit}", description: "Trung bình 5 điểm cuối."}
  mean_all: {unit: "{unit}", description: "Trung bình cả cửa sổ quá khứ."}
  std_all: {unit: "{unit}", description: "Độ lệch chuẩn trong cửa sổ quá khứ (độ dao động)."}
  change_last_10: {unit: "{unit}", description: "Giá trị cuối − giá trị 10 điểm trước."}
  min_all: {unit: "{unit}", description: "Nhỏ nhất trong cửa sổ quá khứ."}
  max_all: {unit: "{unit}", description: "Lớn nhất trong cửa sổ quá khứ."}
  median_all: {unit: "{unit}", description: "Trung vị cửa sổ quá khứ."}
  range_all: {unit: "{unit}", description: "max − min trong cửa sổ quá khứ."}
  slope_all: {unit: "{unit}/điểm", description: "Hệ số góc hồi quy tuyến tính trong cửa sổ quá khứ (xu hướng)."}
  hr_next_5min: {unit: "bpm", description: "TARGET: HR trung bình 5 phút ngay sau cutoff_time."}
  fold: {unit: "", description: "Tên fold (LOSO = subject bị giữ ra)."}
  row: {unit: "", description: "Chỉ số hàng trong bảng đặc trưng (truy ngược về table.csv.gz)."}
  model: {unit: "", description: "Tên mô hình (khóa trong configs/tasks.yaml → models)."}
  y_true: {unit: "{unit}", description: "Giá trị thật của target."}
  y_pred: {unit: "{unit}", description: "Dự đoán OOF (mô hình chưa thấy người này)."}
  prediction: {unit: "{unit}", description: "Dự báo của mô hình đã lưu."}
  low90: {unit: "{unit}", description: "Cận dưới khoảng 90% (split-conformal từ sai số OOF)."}
  high90: {unit: "{unit}", description: "Cận trên khoảng 90%."}
  unit: {unit: "", description: "Đơn vị của prediction."}
  abstain: {unit: "bool", description: "True = từ chối dự báo; lý do ở cột reasons."}
  reasons: {unit: "", description: "Lý do từ chối, phân cách bằng dấu chấm phẩy: missing_features, out_of_training_range, insufficient_calibration_data."}
  in_sample: {unit: "bool", description: "True = người này nằm trong dữ liệu huấn luyện → KHÔNG phải đánh giá trên người mới."}
  abs_error: {unit: "{unit}", description: "|y_true − prediction| (chỉ chế độ backtest)."}
  input_synthetic: {unit: "bool", description: "True = đầu vào là DỮ LIỆU GIẢ ĐỊNH (data/1_synthetic) — dự đoán chỉ để minh họa."}
  correct: {unit: "bool", description: "Phân loại, chế độ có đáp án: prediction == y_true."}
  epoch: {unit: "epoch 30 s", description: "Chỉ số epoch trong đêm (tính từ đầu bản ghi PSG)."}
  dose_rate_next_1h: {unit: "uGy/h", description: "TARGET: tốc độ liều hấp thụ trung bình 1 giờ sau cutoff_time."}
  pre_vo2: {unit: "source_REL_VO2PK", description: "VO2peak tương đối đo trước nằm giường (PRE)."}
  age: {unit: "năm", description: "Tuổi tại PRE (nguồn MR080G)."}
  group_CONTROL: {unit: "0/1", description: "Nhóm CONTROL (đã đối chiếu MR079G/BRSMImmune). Không tồn tại với phi hành gia thật."}
  group_EXERCISE: {unit: "0/1", description: "Nhóm EXERCISE (gồm cả EXERCISE + TESTOSTERONE). Không tồn tại với phi hành gia thật."}
  group_FLY: {unit: "0/1", description: "Nhóm FLY (tập luyện trên thiết bị bay). Không tồn tại với phi hành gia thật."}
  delta_vo2: {unit: "source_REL_VO2PK", description: "TARGET: REL VO2peak POST1 − PRE (âm = giảm thể lực hiếu khí)."}
  stage: {unit: "", description: "TARGET: giai đoạn ngủ do chuyên gia chấm (W, N1, N2, N3 = R&K 3+4, REM)."}
  p_W: {unit: "0–1", description: "Xác suất lớp W (thức)."}
  p_N1: {unit: "0–1", description: "Xác suất lớp N1."}
  p_N2: {unit: "0–1", description: "Xác suất lớp N2."}
  p_N3: {unit: "0–1", description: "Xác suất lớp N3 (ngủ sâu)."}
  p_REM: {unit: "0–1", description: "Xác suất lớp REM."}

# Mẫu regex cho cột sinh tự động (sleep: 3 kênh × 6 dải × hiện tại/trước/sau). {0},{1}… = nhóm bắt được.
column_patterns:
  "(fpz|pz|eog)_logpow": {unit: "log µV²", description: "Kênh {0}: log tổng năng lượng 0,5–30 Hz của epoch hiện tại."}
  "(fpz|pz|eog)_(delta|theta|alpha|sigma|beta)": {unit: "log tỷ lệ", description: "Kênh {0}: log(năng lượng dải {1} / tổng) của epoch hiện tại."}
  "(fpz|pz|eog)_(logpow|delta|theta|alpha|sigma|beta)_(prev|next)": {unit: "như cột gốc", description: "Kênh {0}, đặc trưng {1} của epoch {2} (trước/sau; biên đêm dùng chính epoch)."}

tasks:
  hr:
    cohort: "MMASH 1.0.0 (PhysioNet, ODbL 1.0) — 22 nam khỏe mạnh, mặt đất, ~24 giờ/người"
    source: "data/1_source/processed/sample-v2/mmash_minutes.csv.gz (bảng phút đã QA của NASA-cl)"
    caveats:
      - "Proxy mặt đất, không phải dữ liệu phi hành gia."
      - "HR ngoài 30–220 bpm coi là thiếu (ngưỡng kỹ thuật, không phải lâm sàng); chưa lọc artifact sinh lý."
      - "Cửa sổ chồng lấn: số hàng ≠ số người độc lập (22)."
      - "Thời gian là phút tương đối trong nghiên cứu, không phải UTC."
  dose:
    cohort: "NASA OSDR RadLab — thiết bị Lidal, mô-đun Columbus, ISS, năm 2022 (một chuỗi thiết bị, không phải người)"
    source: "data/1_source/raw/radlab/instruments/Lidal/*.csv (3 file, lưới 5 phút)"
    columns:
      subject_id: {unit: "", description: "Luôn là radlab:Lidal (một chuỗi thiết bị)."}
      cutoff_time: {unit: "thời điểm nguồn", description: "Điểm cuối cửa sổ 6 giờ quá khứ; giữ như nguồn, CHƯA xác minh là UTC."}
      fold: {unit: "", description: "Tháng được giữ làm test (by_month; train = các tháng trước, chừa 1 ngày)."}
    caveats:
      - "Đánh giá theo 9 tháng (4–12/2022): CI95 rất rộng về mặt lý thuyết, chỉ 9 đơn vị độc lập."
      - "Mốc thời gian lặp với giá trị khác nhau bị bỏ cả mốc; không nội suy điểm thiếu."
      - "Liều môi trường trong module, không phải liều cá nhân của phi hành gia."
  cpet:
    cohort: "UTMB CFT70 (NASA NLSP) — nằm giường đầu thấp 70 ngày, người khỏe mạnh mặt đất; 33/38 người đủ điều kiện"
    source: "data/1_source/raw/nlsp/MR080G.zip (+ MR079G, BRSMImmune để đối chiếu GROUP), kiểm SHA-256 + MD5 theo download_manifest.csv"
    caveats:
      - "Loại 5/38 người: 4 do cờ QC CPET (HRPK < 20 hoặc sai lệch công thức VO2 > 5 %, ngưỡng kỹ thuật), 1 do GROUP mâu thuẫn giữa các bảng (ID 6546)."
      - "Một hàng / người (33 hàng): mẫu rất nhỏ; kết quả là pilot kỹ thuật."
      - "group_* chỉ có trong nghiên cứu nằm giường; phi hành gia thật không có → xem task cpet_physio."
      - "EXERCISE gộp cả nhóm có testosterone; không diễn giải thành tác dụng nhân quả của tập luyện."
      - "Đơn vị REL VO2PK giữ như nguồn (suy luận mL/kg/min, chờ codebook)."
  cpet_physio:
    cohort: "UTMB CFT70 — như task cpet, 33 người"
    source: "Như task cpet; chỉ dùng pre_vo2 và age"
    caveats:
      - "Contract đầu vào áp dụng được cho phi hành gia (không cần nhóm can thiệp)."
      - "Một hàng / người (33 hàng): mẫu rất nhỏ; kết quả là pilot kỹ thuật."
  sleep:
    cohort: "Sleep-EDF Expanded 1.0.0 (PhysioNet, ODC-By 1.0) — 10 bản ghi Sleep Cassette, người khỏe mạnh mặt đất, 1 đêm/người"
    source: "data/1_source/raw/sleep_edfx/1.0.0/sleep-cassette/SC4*-PSG.edf + *-Hypnogram.edf (kênh EEG Fpz-Cz, Pz-Oz, EOG ngang)"
    columns:
      subject_id: {unit: "", description: "Mã bản ghi, vd. sleep_edfx:SC400 (một đêm của một người)."}
      fold: {unit: "", description: "Bản ghi bị giữ ra (LOSO theo đêm/người)."}
      y_true: {unit: "", description: "Giai đoạn ngủ thật."}
      y_pred: {unit: "", description: "Giai đoạn ngủ dự đoán OOF."}
      prediction: {unit: "", description: "Giai đoạn ngủ dự đoán."}
    caveats:
      - "Chấm điểm HỒI CỨU (dùng cả epoch sau) — không phải dự báo thời gian thực."
      - "Bỏ epoch '?' và movement; giữ 30 phút thức trước/sau giấc ngủ."
      - "Đánh giá theo 10 người; macro-F1 nhạy với lớp hiếm N1."
  dose_orbit:
    cohort: "Như task dose (RadLab Lidal, ISS Columbus, 2022)"
    source: "data/1_source/raw/radlab/instruments/Lidal/*.csv — thêm cột latitude, longitude, altitude của chính file"
    columns:
      subject_id: {unit: "", description: "Luôn là radlab:Lidal (một chuỗi thiết bị)."}
      cutoff_time: {unit: "thời điểm nguồn", description: "Điểm cuối cửa sổ 6 giờ; chưa xác minh là UTC."}
      fold: {unit: "", description: "Tháng được giữ làm test."}
      latitude_now: {unit: "độ", description: "Vĩ độ ISS tại cutoff (biết được lúc dự báo)."}
      longitude_now: {unit: "độ", description: "Kinh độ ISS tại cutoff."}
      altitude_now: {unit: "km", description: "Độ cao ISS tại cutoff."}
    caveats:
      - "Chỉ dùng vị trí TẠI cutoff, không dùng vị trí 1 giờ tới (chưa có quỹ đạo dự báo)."
      - "Cấu hình chốt sau một thí nghiệm thăm dò trên cùng các tháng test (14/11) → kết quả có thể hơi lạc quan; cần kiểm lại trên năm khác."
      - "9 đơn vị độc lập (tháng)."
  sleep_act:
    cohort: "UTMB Bed Rest Campaign 1 (NASA NLSP, BRSMAct) — 3 người C1G0001–3, 2 đêm trước, ~60 đêm nằm giường, 7 đêm sau"
    source: "data/1_source/raw/nlsp/BRSMAct.zip › BRSMACT_Campagin_1_Actigraphy.csv (kiểm SHA-256 + MD5 theo download_manifest.csv)"
    columns:
      subject_id: {unit: "", description: "utmb_c1:C1G000x — tương ứng persona tomas-ortega / yuki-tanaka / noor-abbasi."}
      cutoff_time: {unit: "ngày", description: "Đêm cuối của cửa sổ 7 đêm quá khứ (ngày gốc của nghiên cứu 2004 — KHÔNG đưa lên web, chỉ dùng ngày tương đối)."}
      sleep_efficiency_next_night: {unit: "%", description: "TARGET: hiệu suất ngủ (actigraphy) của đêm ngay sau cutoff."}
    caveats:
      - "Chỉ 3 người → CI95 theo người gần như vô nghĩa; đây là pilot minh họa, không phải bằng chứng hiệu năng."
      - "Một số đêm có dùng thuốc ngủ (Ambien) — chưa loại, ghi nhận như yếu tố gây nhiễu."
      - "Actigraphy đo ngủ/thức theo cử động, không phải giai đoạn ngủ EEG (khác task sleep)."
      - "Analog nằm giường mặt đất, không phải dữ liệu chuyến bay."
  vitals_sbp: &vitals_dict
    cohort: "UTMB bed rest CRF Daily Vitals — TRAIN: Campaign 3 (23 người); NGOÀI cohort: CFT70 (5160, 8072, 8936) + Campaign 1 (C1G0001–3) = 6 persona"
    source: "data/1_source/raw/nlsp/CRF.zip › */Daily_Vitals/*.csv, CFT70_VITALS/*.csv (kiểm SHA-256 + MD5)"
    columns:
      subject_id: {unit: "", description: "utmb_c3:<id> (train) · utmb_cft70:<id> · utmb_c1:<id> (ngoài cohort)."}
      cutoff_time: {unit: "ngày", description: "Ngày cuối của cửa sổ 7 ngày (ngày gốc của nghiên cứu — KHÔNG hiển thị trên web, chỉ dùng ngày tương đối)."}
      sbp_next_day: {unit: "mmHg", description: "TARGET: huyết áp tâm thu buổi sáng ngày hôm sau."}
      dbp_next_day: {unit: "mmHg", description: "TARGET: huyết áp tâm trương buổi sáng ngày hôm sau."}
      temp_next_day: {unit: "°C", description: "TARGET: nhiệt độ cơ thể buổi sáng ngày hôm sau."}
      pulse_next_day: {unit: "bpm", description: "TARGET: nhịp tim buổi sáng ngày hôm sau."}
    caveats:
      - "Một lần đo/ngày (thường ~6:00), tư thế nằm đầu thấp 6° trong giai đoạn nằm giường."
      - "Ngưỡng kỹ thuật loại số ghi hỏng: HA tâm thu 60–250, tâm trương 30–150 mmHg, nhiệt độ 34–42 °C, mạch 30–220 bpm — KHÔNG phải ngưỡng lâm sàng."
      - "Campaign 1 chỉ có nhiệt độ 112/252 ngày — ngày không đo để trống, không nội suy."
      - "external.csv.gz + external_metrics.csv = đánh giá trên người CHƯA TỪNG THẤY (đúng 6 persona)."
  vitals_dbp: *vitals_dict
  vitals_temp: *vitals_dict
  vitals_pulse: *vitals_dict
  mood:
    cohort: "UTMB CFT70 — NNX10AP86G POMS, 24 người, 13–16 lần đo/người (~hằng tuần)"
    source: "data/1_source/raw/nlsp/NNX10AP86G.zip › NNX10AP86G_CFT70_POMS_TMD.csv"
    columns:
      cutoff_time: {unit: "ngày nghiên cứu", description: "PRE = −BR_Day, IN = +BR_Day, POST = 70 + BR_Day."}
      tmd_next: {unit: "điểm TMD", description: "TARGET: POMS Total Mood Disturbance của lần đo tới (cao hơn = rối loạn tâm trạng nhiều hơn)."}
    caveats:
      - "Thang tự đánh giá; khoảng cách giữa các lần đo không đều (PRE 7–12 ngày, IN 7 ngày)."
      - "Có nhóm can thiệp (Treatment) — không dùng làm đặc trưng."
      - "3 persona Campaign 1 KHÔNG có POMS thật → dữ liệu giả định data/1_synthetic/mood_c1_poms.csv (chỉ để minh họa)."
  glucose:
    cohort: "UTMB CFT70 — NNX10AP86G OGTT, 23 người đủ dữ liệu PRE + ngày nằm giường 66"
    source: "data/1_source/raw/nlsp/NNX10AP86G.zip › NNX10AP86G_CFT70_OGTT.csv (phút 0 = lúc đói; 30–120 = sau uống glucose)"
    columns:
      pre_glucose_0: {unit: "mg/dL", description: "Trung bình đường huyết lúc đói các lần PRE."}
      pre_glucose_120: {unit: "mg/dL", description: "Trung bình đường huyết 2 giờ sau uống glucose, các lần PRE."}
      pre_insulin_0: {unit: "uU/mL", description: "Trung bình insulin lúc đói các lần PRE."}
      delta_glucose_0: {unit: "mg/dL", description: "TARGET: đường huyết lúc đói ngày nằm giường 66 − trung bình PRE."}
    caveats:
      - "Một hàng / người (23 hàng) — pilot. OGTT là nghiệm pháp tại phòng thí nghiệm, không phải CGM."
      - "Đường huyết hằng ngày của persona trên web là DỮ LIỆU GIẢ ĐỊNH (data/1_synthetic/glucose_daily_personas.csv), neo vào giá trị OGTT thật với CFT70."
  vitals_resp: *vitals_dict
  vitals_weight: *vitals_dict
  sleep_act_duration:
    cohort: "UTMB Bed Rest Campaign 1 (BRSMAct) — 3 người C1G0001–3 (= tomas, yuki, noor)"
    source: "data/1_source/raw/nlsp/BRSMAct.zip › BRSMACT_Campagin_1_Actigraphy.csv"
    columns:
      sleep_hours_next_night: {unit: "giờ", description: "TARGET: thời lượng ngủ (actigraphy) đêm tới."}
    caveats:
      - "Chỉ 3 người → pilot; có đêm dùng thuốc ngủ (Ambien)."
      - "3 persona CFT70 dùng dữ liệu GIẢ ĐỊNH data/1_synthetic/sleep_cft70_actigraphy.csv (cột duration)."
  fatigue:
    cohort: "UTMB CFT70 — NNX10AP86G MFSI-SF (Multidimensional Fatigue Symptom Inventory – Short Form), 24 người, ~16 lần đo/người"
    source: "data/1_source/raw/nlsp/NNX10AP86G.zip › NNX10AP86G_CFT70_MFSI-SF_Total_Scale.csv"
    columns:
      cutoff_time: {unit: "ngày nghiên cứu", description: "PRE = −BR_Day, IN = +BR_Day, POST = 70 + BR_Day."}
      mfsi_total_next: {unit: "điểm", description: "TARGET: tổng điểm mệt mỏi MFSI-SF lần đo tới (cao hơn = mệt hơn; có thể âm vì trừ thang sức sống)."}
    caveats:
      - "Thang tự đánh giá; 3 persona Campaign 1 không có MFSI-SF."
  lean_mass_legs: &prepost_dict
    cohort: "UTMB CFT70 (nằm giường 70 ngày) — người có đo PRE và ngày 70"
    source: "data/1_source/raw/nlsp/NNX10AP86G.zip (iDXA) hoặc BRSMCF.zip (siêu âm tim 3D) — xem tasks.yaml › member, value_column"
    columns:
      baseline: {unit: "đơn vị nguồn", description: "Trung bình mọi lần đo PRE của người đó (g với iDXA, g với LV mass, mL với LVDV)."}
      pct_change_day70: {unit: "% so với PRE", description: "TARGET: (giá trị ngày nằm giường 70 / baseline − 1) × 100."}
    caveats:
